<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1867C0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="希望工作室（Hope Studio）官方网站——一个由学生组成的技术兴趣团队，专注桌面应用开发、操作系统探索与开源分享。有希望者，事竟成。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="希望工作室 | Hope Studio" />
    <meta property="og:description" content="希望工作室官方网站——有希望者，事竟成。" />
    <meta property="og:image" content="/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <!-- MD3E variable font (self-hosted Roboto Flex, no external dependency) -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>希望工作室 | Hope Studio</title>
    <!-- 主题预加载：先于 Vue 挂载设定，避免深色/浅色闪烁（FOUC） -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("hope-studio-theme");
          if (t !== "dark" && t !== "light") {
            t =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
