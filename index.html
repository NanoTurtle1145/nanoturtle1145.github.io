<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F1011" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="希望工作室（Hope Studio）官方网站——一个由学生组成的技术兴趣团队，专注桌面应用开发、操作系统探索与开源分享。有希望者，事竟成。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="希望工作室 | Hope Studio" />
    <meta property="og:description" content="希望工作室官方网站——有希望者，事竟成。" />
    <meta property="og:image" content="/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <!-- MD3E variable font (self-hosted Roboto Flex, no external dependency) -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>希望工作室 | Hope Studio</title>
    <!-- 主题预加载：已保存选择 > 系统偏好 > 深色；先于 Vue 挂载设定，避免明暗闪烁（FOUC） -->
    <script>
      (function () {
        var name = "dark";
        try {
          var saved = localStorage.getItem("hope-theme");
          if (saved === "light" || saved === "dark") {
            name = saved;
          } else if (window.matchMedia && !window.matchMedia("(prefers-color-scheme: dark)").matches) {
            name = "light";
          }
        } catch (e) {
          name = "dark";
        }
        document.documentElement.dataset.theme = name;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", name === "dark" ? "#010102" : "#f5f6f8");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
