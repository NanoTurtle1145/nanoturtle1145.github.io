<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="希望工作室 Hope Studio 标志">
  <title>希望工作室 Hope Studio 标志</title>
  <!-- 白底铺满画布：站内深色顶栏与浏览器标签页需要浅底才能看清黑色线稿 -->
  <rect width="1024" height="1024" fill="#fff"/>
  <!-- 全部为描边线稿，统一线宽 11.5；坐标系 1024×1024 -->
  <g fill="none" stroke="#070707" stroke-width="11.5" stroke-linecap="butt">
    <!-- 外圆：顶部被吊环内孔截断 -->
    <path d="M567.66 107.60A421.4 421.4 0 1 1 428.62 108.99"/>
    <!-- 内圆：顶部缺口 + 底部 Λ 形缺口 -->
    <path d="M567.88 110.84A348.9 348.9 0 0 1 604 787L502.0 640.5L400 787A348.9 348.9 0 0 1 428.46 112.48"/>
    <!-- 顶部吊环（内孔 Ø139.5） -->
    <circle cx="498.2" cy="113.9" r="75.5"/>
  </g>
  <!-- 五角星轮廓：10 顶点 + 圆角连接（纵向比横向高 4.3%，与原图一致） -->
  <path fill="none" stroke="#070707" stroke-width="11.5" stroke-linejoin="round" d="M501.3 204.4L440.8 386.6L255.9 390.3L403.3 506.7L349.7 691.2L501.3 580.9L652.9 691.2L599.3 506.7L746.7 390.3L561.8 386.6Z"/>
</svg>
