<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HopeOS 模拟器</title>
<style>
  /* Palette taken verbatim from kernel/gui/gui_internal.h + the paint functions
     so this front-end matches the real kernel render, not a guess. */
  :root {
    --face:    #c0c0c0;   /* WIN9X_FACE */
    --hi:      #ffffff;   /* WIN9X_HI */
    --sh:      #808080;   /* WIN9X_SH */
    --dk:      #404040;   /* WIN9X_DK */
    --wall-top:#21548c;   /* paint_wallpaper() top (33,84,140) */
    --wall-bot:#0c1e36;   /* paint_wallpaper() bottom (12,30,54) */
    --accent:  #0054e3;   /* COL_ACCENT (0,84,227) */
    --accent-dk:#143891;  /* COL_ACCENT_DARK (20,56,145) */
    --title-hi:#3e87f6;   /* WIN9X_TITLE_HI (62,135,246) */
    --title-lo:#0b36a2;   /* WIN9X_TITLE_LO (11,54,162) */
    --title-in:#808080;   /* WIN9X_TITLE_IN */
    --paper:   #ffffff;   /* COL_PAPER */
    --win7-hdr:#2358b2;   /* WIN7_HEADER (35,88,178) */
    --win7-hdr2:#0d307c;  /* WIN7_HEADER2 (13,48,124) */
    --win7-sel:#4667d0;   /* WIN7_SEL (70,103,208) */
    --win7-pow:#5f8ce6;   /* WIN7_POWER (95,140,230) */
    --text:    #000000;
    --text-dim:#808080;
    --term-bg: #000000;
    --term-fg: #c8c8c8;   /* terminal text (200,200,200) */
    --term-cur:#64dc64;   /* terminal cursor (100,220,100) */
    --term-bd: #3c3c3c;   /* terminal 60,60,60 frame */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", Tahoma, system-ui, sans-serif;
    color: var(--text);
    user-select: none; -webkit-user-select: none;
    font-size: 13px;
  }

  /* 2px Win9x bevel: light top/left, dark bottom/right (gui_bevel). */
  .bevel { border: 2px solid; border-color: var(--hi) var(--sh) var(--sh) var(--hi); }
  .bevel-sunken { border: 2px solid; border-color: var(--sh) var(--hi) var(--hi) var(--sh); }

  /* ---------------- Boot ---------------- */
  #boot {
    position: absolute; inset: 0; z-index: 200;
    background: #000; color: #cfcfcf;
    font-family: "Consolas", "Courier New", monospace; font-size: 13px; line-height: 1.5;
    padding: 28px 32px; white-space: pre-wrap; transition: opacity .4s ease;
  }
  #boot .ok { color: #7ec47e; }
  #boot .dim { color: #5a5a5a; }
  #boot-hint { position: absolute; bottom: 18px; right: 24px; color: #555; font-size: 12px; cursor: pointer; }

  /* ---------------- Desktop ---------------- */
  #desktop {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, var(--wall-top) 0%, var(--wall-bot) 100%);
  }
  #icons { position: absolute; left: 0; top: 0; }
  .dicon {
    position: absolute; width: 96px; height: 64px; cursor: pointer; text-align: center;
  }
  .dicon .tile {
    width: 36px; height: 36px; margin: 0 auto; background: var(--accent);
    border-radius: 6px; border: 1px solid var(--accent-dk);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: bold; font-size: 18px;
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.4);
  }
  .dicon .lbl { color: #fff; font-size: 12px; margin-top: 4px; text-shadow: 0 1px 2px #000; }

  /* ---------------- Taskbar ---------------- */
  #taskbar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 40px;
    background: var(--face); z-index: 150;
    border-top: 2px solid var(--hi);
    display: flex; align-items: center; gap: 0; padding: 0 0 0 0;
  }
  #start-btn {
    position: absolute; left: 8px; top: 5px; width: 112px; height: 30px;
    background: var(--face); color: #000; font-weight: 600; font-size: 13px;
    display: flex; align-items: center; gap: 6px; padding: 0 8px; cursor: pointer;
  }
  #start-btn.open { border-color: var(--sh) var(--hi) var(--hi) var(--sh); }
  #start-btn .flag { display: grid; grid-template-columns: 7px 7px; grid-template-rows: 7px 7px; gap: 0; }
  #start-btn .flag span { display: block; }
  #start-btn .flag .r { background: #dc2828; }
  #start-btn .flag .g { background: #28aa3c; }
  #start-btn .flag .b { background: #286edc; }
  #start-btn .flag .y { background: #ebc828; }
  #task-items { position: absolute; left: 130px; top: 5px; right: 96px; height: 30px; }
  .task-item {
    position: absolute; top: 0; height: 30px;
    background: var(--face); color: #000; font-size: 13px;
    display: flex; align-items: center; padding: 0 8px; cursor: pointer; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis;
  }
  .task-item.active { border-color: var(--sh) var(--hi) var(--hi) var(--sh); background: #b9b9b9; }
  .task-item.min { color: var(--text-dim); }
  #clock {
    position: absolute; right: 8px; top: 5px; width: 80px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid; border-color: var(--sh) var(--hi) var(--hi) var(--sh);
    font-size: 12px; color: #000; background: var(--face);
  }

  /* ---------------- Start menu ---------------- */
  #startmenu {
    position: absolute; width: 384px; z-index: 160; display: none;
    background: var(--face);
  }
  #startmenu.open { display: block; }
  .sm-header {
    height: 58px; margin: 1px;
    background: linear-gradient(180deg, var(--win7-hdr) 0%, var(--win7-hdr2) 100%);
    display: flex; align-items: center; gap: 10px; padding: 0 12px; color: #fff; position: relative;
  }
  .sm-header .flag { display: grid; grid-template-columns: 7px 7px; grid-template-rows: 7px 7px; gap: 0; }
  .sm-header .flag span { display: block; width: 7px; height: 7px; }
  .sm-header .flag .r { background: #dc2828; }
  .sm-header .flag .g { background: #28aa3c; }
  .sm-header .flag .b { background: #286edc; }
  .sm-header .flag .y { background: #ebc828; }
  .sm-header .brand { flex: 1; }
  .sm-header .brand .b1 { font-weight: bold; font-size: 16px; }
  .sm-header .brand .b2 { font-size: 12px; color: #dce6ff; }
  .sm-header .avatar {
    width: 44px; height: 44px; background: #fff; border: 1px solid #9aa1ad; border-radius: 3px;
    position: relative; overflow: hidden;
  }
  .sm-header .avatar::before { content:""; position:absolute; left:50%; top:28%; width:16px; height:16px; border-radius:50%; background: var(--accent); transform: translateX(-50%); }
  .sm-header .avatar::after { content:""; position:absolute; left:50%; top:55%; width:30px; height:26px; border-radius:50%; background: var(--accent); transform: translateX(-50%); }
  .sm-body { display: flex; }
  .sm-left { width: 224px; }
  .sm-right {
    width: 160px; background: #fff; border-left: 1px solid var(--sh);
  }
  .sm-row {
    height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 8px; cursor: pointer; font-size: 13px;
  }
  .sm-row .ic {
    width: 24px; height: 24px; color: #fff; font-weight: bold; display: flex; align-items: center; justify-content: center;
    border-radius: 3px; flex: 0 0 auto;
  }
  .sm-row.left .ic { background: var(--accent); }
  .sm-row.right .ic { background: var(--win7-hdr); }
  .sm-row.hot { background: var(--win7-sel); color: #fff; }
  .sm-bottom {
    height: 42px; margin: 0 1px 1px 1px;
    background: linear-gradient(180deg, var(--win7-hdr) 0%, var(--win7-hdr2) 100%);
    display: flex; align-items: center; justify-content: space-between; padding: 0 10px;
  }
  .sm-search {
    flex: 0 0 184px; height: 26px; background: #fff; border: 2px solid; border-color: var(--sh) var(--hi) var(--hi) var(--sh);
    display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--text-dim); font-size: 12px;
  }
  .sm-search .mag { width: 12px; height: 12px; border: 2px solid #333; border-radius: 50%; position: relative; }
  .sm-search .mag::after { content:""; position:absolute; right:-4px; bottom:-3px; width:6px; height:2px; background:#333; transform: rotate(45deg); }
  .sm-power {
    width: 22px; height: 22px; border-radius: 50%; background: var(--win7-pow);
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .sm-power::before { content:""; width:2px; height:9px; background:#fff; border-radius:1px; }

  /* ---------------- Windows ---------------- */
  .window {
    position: absolute; min-width: 200px; min-height: 120px;
    background: var(--face);
    border: 1px solid var(--dk);
    box-shadow: inset 2px 2px 0 var(--hi), inset -2px -2px 0 var(--sh);
    display: flex; flex-direction: column; z-index: 10;
  }
  .titlebar {
    height: 22px; flex: 0 0 22px; position: relative;
    background: linear-gradient(90deg, var(--title-hi) 0%, var(--title-lo) 100%);
    display: flex; align-items: center; cursor: move;
  }
  .window.inactive .titlebar { background: var(--title-in); }
  .title-icon {
    width: 16px; height: 16px; margin-left: 6px; background: #fff; color: var(--accent);
    display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 11px; border-radius: 2px;
  }
  .title-text {
    flex: 1; color: #fff; font-size: 13px; font-weight: 600; margin-left: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 22px;
    text-shadow: 0 1px 1px rgba(0,0,0,.3);
  }
  .title-btns { position: absolute; right: 5px; top: 4px; display: flex; gap: 1px; }
  .title-btn {
    width: 16px; height: 14px; background: var(--face); color: #000; font-size: 10px; line-height: 11px;
    border: 2px solid; border-color: var(--hi) var(--sh) var(--sh) var(--hi);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .title-btn:hover { background: #d4d4d4; }
  .title-btn.close:hover { background: #c0392b; color: #fff; border-color: #ff8a8a; }
  .win-client {
    position: absolute; left: 3px; right: 3px; bottom: 3px; top: 23px;
    background: var(--paper); overflow: hidden;
  }

  /* ---------------- Terminal ---------------- */
  .term {
    position: absolute; inset: 0; background: var(--term-bg); color: var(--term-fg);
    font-family: "Consolas", "Courier New", monospace; font-size: 13px; line-height: 16px;
    padding: 2px 0 2px 4px; overflow: auto; white-space: pre-wrap; word-break: break-word;
  }
  .term .err { color: #ff6b6b; }
  .term .dim { color: #888; }
  .term-cursor { display: inline-block; width: 7px; height: 14px; background: var(--term-cur); vertical-align: text-bottom; }

  /* ---------------- Built-in dialogs ---------------- */
  .welcome, .sysinfo, .run, .app-pane { position: absolute; inset: 0; background: var(--paper); padding: 16px; }
  .welcome h2 { font-size: 22px; margin-bottom: 12px; }
  .welcome p { color: var(--text-dim); margin-bottom: 4px; }
  .welcome p.acc { color: var(--accent); margin-top: 8px; }
  .sysinfo h4 { font-size: 15px; margin-bottom: 8px; }
  .sysinfo div { color: var(--text-dim); line-height: 1.7; }
  .dlg-btns { position: absolute; bottom: 16px; right: 16px; display: flex; gap: 8px; }
  .btn {
    min-width: 78px; height: 32px; padding: 0 12px; cursor: pointer; font-size: 13px;
  }
  .btn.primary { background: var(--accent); color: #fff; border: 2px solid var(--accent-dk); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.normal { background: var(--face); color: #000; border: 2px solid var(--sh); }
  .btn.normal:hover { background: #d4d4d4; }
  .run-label { color: var(--text-dim); margin: 4px 0 8px 0; }
  .run-input {
    width: calc(100% - 8px); height: 24px; background: #fff; border: 2px solid; border-color: var(--sh) var(--hi) var(--hi) var(--sh);
    padding: 0 4px; font-size: 13px; color: #000; outline: none;
  }

  /* ---------------- App: notepad ---------------- */
  .np-toolbar { height: 24px; background: #dcdcdc; border-bottom: 1px solid #a0a0a0; display: flex; align-items: center; padding: 0 6px; gap: 8px; }
  .np-toolbar .t { color: #3c3c3c; font-size: 12px; }
  .np-btn { background: #becdff; border: 1px solid #a0a0a0; padding: 1px 8px; font-size: 12px; color: #14143c; cursor: pointer; }
  .np-area { position: absolute; left: 4px; right: 4px; top: 28px; bottom: 4px; background: #fff; border: 1px solid #a0a0a0; padding: 4px; overflow: auto; font-family: "Consolas", monospace; font-size: 13px; line-height: 16px; color: #1e1e1e; }
  .np-area:focus { outline: none; }

  /* ---------------- App: calculator ---------------- */
  .calc { position: absolute; inset: 0; background: #2d2d2d; padding: 10px; }
  .calc-disp { height: 36px; background: #1e1e1e; border: 1px solid #646464; color: #fff; font-family: "Consolas", monospace; font-size: 20px; display: flex; align-items: center; justify-content: flex-end; padding: 0 8px; }
  .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 10px; }
  .calc-grid button { height: 36px; border: none; color: #c8c8c8; cursor: pointer; font-size: 14px; font-weight: bold; border-radius: 2px; }
  .calc-grid button:active { filter: brightness(1.25); }
  .calc-num { background: #505050; }
  .calc-op { background: #c87832; color: #fff; }
  .calc-eq { background: #329632; color: #fff; }
  .calc-clr { background: #b43232; color: #fff; }

  /* ---------------- App: clock ---------------- */
  .clk { position: absolute; inset: 0; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .clk .big { font-family: "Consolas", monospace; font-size: 34px; color: #143891; }
  .clk .sub { color: var(--text-dim); }

  /* ---------------- App: paint ---------------- */
  .paint { position: absolute; inset: 0; background: #fff; }
  .paint canvas { display: block; background: #fff; cursor: crosshair; touch-action: none; }

  /* ---------------- App: sysmonitor ---------------- */
  .sys { position: absolute; inset: 0; background: #fff; padding: 12px; font-family: "Consolas", monospace; font-size: 13px; color: var(--text-dim); line-height: 1.8; }
  .sys b { color: #333; }

  /* ---------------- App: filemgr ---------------- */
  .fm { position: absolute; inset: 0; background: #fff; padding: 10px; font-family: "Consolas", monospace; font-size: 13px; color: #1e1e1e; overflow: auto; }

  /* ---------------- App: placeholder ---------------- */
  .ph { position: absolute; inset: 0; background: #fff; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; color: var(--text-dim); }
  .ph .big { font-size: 18px; color: #333; }
</style>
</head>
<body>
  <div id="boot"><span id="boot-text"></span><span id="boot-hint">点击任意处跳过</span></div>

  <div id="desktop">
    <div id="icons"></div>
    <div id="windows"></div>
    <div id="taskbar">
      <div id="start-btn">
        <div class="flag"><span class="r"></span><span class="g"></span><span class="b"></span><span class="y"></span></div>
        <span>开始</span>
      </div>
      <div id="task-items"></div>
      <div id="clock">--:--:--</div>
    </div>
    <div id="startmenu"></div>
  </div>

<script>
(function () {
  "use strict";

  /* ===================== geometry constants (from kernel) ===================== */
  var TITLE_H = 22, TASKBAR_H = 40;

  /* ===================== Boot ===================== */
  var bootEl = document.getElementById("boot");
  var bootText = document.getElementById("boot-text");
  var desktop = document.getElementById("desktop");
  /* Mirrors the real kernel boot log (kernel/main.c: the UEFI console prints
     "HopeOS Kernel" / "Kernel started successfully." / "Kernel heap: 64 MiB
     ready." / "Page pool: 16 MiB ready." / "VFS: ramfs ready." / "Preloaded
     /bin from ESP." / "Loaded CJK font from ESP." / "Filesystem mounted."),
     followed by the in-kernel takeover + GUI handover milestones. */
  var bootLines = [
    "HopeOS Kernel",
    "Kernel started successfully.",
    "Kernel heap: 64 MiB ready.",
    "Page pool: 16 MiB ready.",
    "VFS: ramfs ready.",
    "Preloaded /bin from ESP.",
    "Loaded CJK font from ESP.",
    "Filesystem mounted.",
    "",
    "Enabling long mode / paging (CR0.PG, CR4.PAE).. [ ok ]",
    "Installing GDT / TSS / 256-entry IDT.......... [ ok ]",
    "Remapping 8259 PIC, arming PIT @ 100 Hz....... [ ok ]",
    "Initializing FPU / SSE state.................. [ ok ]",
    "Starting preemptive scheduler (16 threads).... [ ok ]",
    "Compositor: caching desktop + taskbar......... [ ok ]",
    "Window manager: 9 apps registered............. [ ok ]",
    "Launching GUI shell (ring 3).................. [ ok ]",
    "",
    "Welcome to HopeOS. Launching desktop..."
  ];
  var bi = 0, bc = 0, bootTimer = null, booted = false;
  function typeBoot() {
    if (bi >= bootLines.length) { finishBoot(); return; }
    var line = bootLines[bi];
    if (bc === 0 && bootText.innerHTML && line !== "") bootText.appendChild(document.createTextNode("\n"));
    if (bc < line.length) {
      var span = document.createElement("span");
      if (line.indexOf("[ ok ]") >= 0) span.className = "ok";
      span.textContent = line[bc]; bootText.appendChild(span); bc++;
      bootTimer = setTimeout(typeBoot, line ? 5 : 18);
    } else { bi++; bc = 0; bootTimer = setTimeout(typeBoot, line === "" ? 60 : 40); }
  }
  function finishBoot() {
    if (booted) return; booted = true;
    if (bootTimer) clearTimeout(bootTimer);
    bootEl.style.opacity = "0";
    setTimeout(function () {
      bootEl.style.display = "none";
      buildIcons();
      buildStartMenu();
      openBuiltin("welcome");
      openBuiltin("sysinfo");
    }, 400);
  }
  bootEl.addEventListener("click", finishBoot);
  typeBoot();

  /* ===================== filesystem (for filemgr/terminal) ===================== */
  var FS = {
    "/": { type: "dir", children: ["home", "bin", "readme.txt", "hello.txt"] },
    "/home": { type: "dir", children: ["hopeos"] },
    "/home/hopeos": { type: "dir", children: ["notes.txt", "projects"] },
    "/home/hopeos/projects": { type: "dir", children: ["hopeos.os", "stardustui"] },
    "/bin": { type: "dir", children: ["sh", "ls", "cat", "ver", "hello"] },
    "/readme.txt": { type: "file", data: "HopeOS 0.2.0 (M0)\n一个从零编写的 UEFI 操作系统。\n输入 'help' 查看命令。\n" },
    "/hello.txt": { type: "file", data: "Hello from HopeOS!\n" },
    "/home/hopeos/notes.txt": { type: "file", data: "TODO:\n  [进行中] 按需缺页\n  [计划]  持久化文件系统\n  [计划]  libc 完善 + BusyBox\n  [远期]  JVM -> Minecraft\n" },
    "/home/hopeos/projects/hopeos.os": { type: "file", data: "<kernel binary, 2.1 MiB>\n" },
    "/home/hopeos/projects/stardustui": { type: "file", data: "<user GUI framework>\n" }
  };
  function resolve(path) {
    if (!path) return null;
    if (path[0] !== "/") path = (cwd === "/" ? "/" : cwd + "/") + path;
    var parts = path.split("/").filter(function (p) { return p && p !== "."; });
    var node = FS["/"]; var cur = "/";
    for (var i = 0; i < parts.length; i++) {
      if (parts[i] === "..") { if (cur !== "/") cur = cur.substring(0, cur.lastIndexOf("/")) || "/"; node = FS[cur] || FS["/"]; continue; }
      if (!node || node.type !== "dir" || node.children.indexOf(parts[i]) < 0) return null;
      cur = (cur === "/" ? "" : cur) + "/" + parts[i]; node = FS[cur];
    }
    return node ? { path: cur, node: node } : null;
  }
  var cwd = "/home/hopeos";

  /* ===================== app registry (mirrors main.c app_register order) ===================== */
  var APPS = [
    { key: "terminal",     name: "Terminal",      icon: "T", w: 400, h: 280, make: makeTerminal },
    { key: "calculator",   name: "Calculator",    icon: "C", w: 240, h: 300, make: makeCalculator },
    { key: "clock",        name: "Clock",         icon: "K", w: 240, h: 170, make: makeClock },
    { key: "paint",        name: "Paint",         icon: "P", w: 440, h: 330, make: makePaint },
    { key: "snake",        name: "Snake",         icon: "S", w: 360, h: 300, make: makeSnake },
    { key: "notepad",      name: "Notepad",       icon: "N", w: 440, h: 320, make: makeNotepad },
    { key: "sysmonitor",   name: "SysMonitor",    icon: "M", w: 320, h: 250, make: makeSys },
    { key: "filemgr",      name: "FileMgr",       icon: "F", w: 440, h: 320, make: makeFm },
    { key: "controlpanel", name: "Control Panel", icon: "C", w: 360, h: 260, make: makeControl }
  ];
  function appByName(n) {
    for (var i = 0; i < APPS.length; i++)
      if (APPS[i].name.toLowerCase() === n.toLowerCase()) return i;
    return -1;
  }

  /* ===================== desktop icons ===================== */
  function buildIcons() {
    var box = document.getElementById("icons");
    box.innerHTML = "";
    var IW = 96, IH = 64, TILE = 36, GAP = 8, X0 = 16, Y0 = 16;
    var yLimit = window.innerHeight - TASKBAR_H - IH;
    var x = X0, y = Y0;
    APPS.forEach(function (a, i) {
      if (y > yLimit) { y = Y0; x += IW + GAP; }
      var d = document.createElement("div");
      d.className = "dicon";
      d.style.left = x + "px"; d.style.top = y + "px";
      d.innerHTML = '<div class="tile">' + a.icon + '</div><div class="lbl">' + a.name + '</div>';
      d.addEventListener("dblclick", function () { openApp(i); });
      d.addEventListener("click", function () { openApp(i); });
      box.appendChild(d);
      y += IH + GAP;
    });
  }

  /* ===================== window manager ===================== */
  var zIndex = 10, winCount = 0;
  var windowsEl = document.getElementById("windows");
  var taskItemsEl = document.getElementById("task-items");
  var openWins = {};   /* key -> rec */

  function recFor(title, kind, extra) {
    var rec = { el: null, title: title, kind: kind, body: null, taskEl: null, minimized: false, maximized: false, prev: null };
    if (extra) for (var k in extra) rec[k] = extra[k];
    return rec;
  }

  function makeFrame(rec, w, h, x, y, iconChar, whiteIcon) {
    var el = document.createElement("div");
    el.className = "window";
    el.style.width = w + "px"; el.style.height = h + "px";
    el.style.left = x + "px"; el.style.top = y + "px";

    var bar = document.createElement("div"); bar.className = "titlebar";
    var ico = document.createElement("div"); ico.className = "title-icon"; ico.textContent = iconChar || "?";
    if (whiteIcon) ico.style.color = "#fff";
    var tt = document.createElement("div"); tt.className = "title-text"; tt.textContent = rec.title;
    var btns = document.createElement("div"); btns.className = "title-btns";
    var min = document.createElement("div"); min.className = "title-btn"; min.textContent = "_";
    var max = document.createElement("div"); max.className = "title-btn"; max.textContent = "□";
    var close = document.createElement("div"); close.className = "title-btn close"; close.textContent = "✕";
    btns.appendChild(min); btns.appendChild(max); btns.appendChild(close);
    bar.appendChild(ico); bar.appendChild(tt); bar.appendChild(btns);

    var client = document.createElement("div"); client.className = "win-client";
    el.appendChild(bar); el.appendChild(client);
    windowsEl.appendChild(el);

    rec.el = el; rec.body = client; rec.titleText = tt;
    el._min = min; el._max = max; el._close = close;

    /* drag */
    var drag = false, ox = 0, oy = 0;
    bar.addEventListener("mousedown", function (e) {
      if (e.target.closest(".title-btn")) return;
      drag = true; ox = e.clientX - el.offsetLeft; oy = e.clientY - el.offsetTop; focus(rec); e.preventDefault();
    });
    document.addEventListener("mousemove", function (e) {
      if (!drag) return;
      var nx = Math.max(0, Math.min(e.clientX - ox, window.innerWidth - 40));
      var ny = Math.max(0, Math.min(e.clientY - oy, window.innerHeight - TASKBAR_H - 4));
      el.style.left = nx + "px"; el.style.top = ny + "px";
    });
    document.addEventListener("mouseup", function () { drag = false; });

    min.addEventListener("click", function (e) { e.stopPropagation(); minimize(rec); });
    max.addEventListener("click", function (e) { e.stopPropagation(); toggleMax(rec); });
    close.addEventListener("click", function (e) { e.stopPropagation(); closeWin(rec); });
    return el;
  }

  function focus(rec) {
    zIndex++; rec.el.style.zIndex = zIndex; rec.el.classList.remove("inactive");
    Object.keys(openWins).forEach(function (k) { if (openWins[k] !== rec) openWins[k].el.classList.add("inactive"); });
    if (rec.minimized) { rec.minimized = false; rec.el.style.display = "flex"; }
    Array.prototype.forEach.call(taskItemsEl.children, function (c) { c.classList.remove("active"); c.classList.remove("min"); });
    if (rec.taskEl) { rec.taskEl.classList.add("active"); if (rec.minimized) rec.taskEl.classList.add("min"); }
    if (rec.onFocus) rec.onFocus();
  }
  function minimize(rec) {
    rec.minimized = true; rec.el.style.display = "none";
    if (rec.taskEl) rec.taskEl.classList.add("min");
    guiFocusTopmost();
  }
  function toggleMax(rec) {
    if (rec.maximized) {
      rec.maximized = false;
      rec.el.style.left = rec.prev.x; rec.el.style.top = rec.prev.y;
      rec.el.style.width = rec.prev.w; rec.el.style.height = rec.prev.h;
    } else {
      rec.prev = { x: rec.el.offsetLeft, y: rec.el.offsetTop, w: rec.el.offsetWidth, h: rec.el.offsetHeight };
      rec.maximized = true;
      rec.el.style.left = "0px"; rec.el.style.top = "0px";
      rec.el.style.width = window.innerWidth + "px";
      rec.el.style.height = (window.innerHeight - TASKBAR_H) + "px";
    }
    focus(rec);
  }
  function closeWin(rec) {
    if (rec.el && rec.el.parentNode) rec.el.parentNode.removeChild(rec.el);
    if (rec.taskEl && rec.taskEl.parentNode) rec.taskEl.parentNode.removeChild(rec.taskEl);
    delete openWins[rec.key];
    if (rec.onClose) rec.onClose();
    guiFocusTopmost();
  }
  function guiFocusTopmost() {
    var top = null;
    Object.keys(openWins).forEach(function (k) {
      var r = openWins[k];
      if (!r.minimized && (!top || parseInt(r.el.style.zIndex) > parseInt(top.el.style.zIndex))) top = r;
    });
    if (top) focus(top);
  }
  function makeTaskItem(rec) {
    var t = document.createElement("div"); t.className = "task-item active"; t.textContent = rec.title;
    t.addEventListener("click", function () {
      if (rec.minimized) { rec.minimized = false; rec.el.style.display = "flex"; }
      else if (parseInt(rec.el.style.zIndex) === zIndex) { minimize(rec); return; }
      focus(rec);
    });
    rec.taskEl = t; layoutTaskItems();
  }
  function layoutTaskItems() {
    var n = 0;
    Object.keys(openWins).forEach(function (k) { if (!openWins[k].minimized) n++; });
    var avail = taskItemsEl.clientWidth;
    var bw = Math.max(48, Math.min(168, (avail - (n - 1) * 6) / (n || 1)));
    var x = 0;
    Object.keys(openWins).forEach(function (k) {
      var t = openWins[k].taskEl; if (!t) return;
      t.style.left = x + "px"; t.style.width = bw + "px"; x += bw + 6;
    });
  }

  function openApp(i) {

    winCount++;

  /* ===================== terminal (black / gray / green cursor) =====================
     Mirrors user/sh.c: builtins help/cd/pwd/echo/export/unset/env/exit, prompt
     "hopeos:<cwd>$ ", and the shell greeting printed after terminal.c's
     "HopeOS Terminal" banner. ls/cat/ver/hello/credits/etc. are emulated /bin
     programs reading the ramfs. */
  function makeTerminal(rec) {
    var box = document.createElement("div"); box.className = "term";
    var hist = [], hidx = -1, buf = "", cur = 0;
    var env = {};            /* shell-owned environment (export/unset/env) */
    var lastStatus = 0;
    var fakePid = 1;
    function promptStr() { return "hopeos:" + cwd + "$ "; }
    function render() {
      var html = outHTML;
      html += '<span>' + esc(promptStr()) + '</span>';
      html += esc(buf.slice(0, cur)) + '<span class="term-cursor"></span>' + esc(buf.slice(cur));
      box.innerHTML = html;
      box.scrollTop = box.scrollHeight;
    }
    var outHTML = "";
    function print(s, cls) { outHTML += '<div class="' + (cls || "") + '">' + (s === "" ? " " : esc(s)) + '</div>'; }
    /* $VAR / ${VAR} / $$ / $? expansion, run on the whole line before exec. */
    function expand(line) {
      return line
        .replace(/\$\{(\w+)\}/g, function (_, n) { return env[n] || ""; })
        .replace(/\$(\w+)/g, function (_, n) { return env[n] || ""; })
        .replace(/\$\$/g, String(fakePid))
        .replace(/\$\?/g, String(lastStatus));
    }
    var commands = {
      help: function () {
        print("builtins: exit cd pwd echo export unset env help");
        print("operators: | ; && ||   redirs: < > >>");
        print("expansion: $VAR ${VAR} $$ $?  ~  globs: * ?");
        print("everything else is a program in /bin -- run `ls /bin`");
      },
      cd: function (a) {
        var dir = a.length ? a[0] : "/";
        if (dir[0] === "~") dir = "/";           /* HOME defaults to "/" */
        var t = resolve(dir);
        if (!t || t.node.type !== "dir") { print("cd: " + dir + ": Not a directory", "err"); lastStatus = 1; return; }
        cwd = t.path; lastStatus = 0;
      },
      pwd: function () { print(cwd); lastStatus = 0; },
      echo: function (a) { print(a.join(" ")); lastStatus = 0; },
      export: function (a) {
        a.forEach(function (kv) { var i = kv.indexOf("="); if (i > 0) env[kv.slice(0, i)] = kv.slice(i + 1); });
        lastStatus = 0;
      },
      unset: function (a) { a.forEach(function (n) { delete env[n]; }); lastStatus = 0; },
      env: function () { Object.keys(env).forEach(function (k) { print(k + "=" + env[k]); }); lastStatus = 0; },
      exit: function () { closeWin(rec); },
      /* ---- emulated /bin programs (read the ramfs) ---- */
      ls: function (a) {
        var tgt = a[0] ? resolve(a[0]) : resolve(cwd);
        if (!tgt) { print("ls: cannot access '" + (a[0] || cwd) + "': No such file or directory", "err"); lastStatus = 1; return; }
        if (tgt.node.type === "file") { print(a[0] || cwd); lastStatus = 0; return; }
        print(tgt.node.children.slice().sort().map(function (n) {
          var full = (tgt.path === "/" ? "" : tgt.path) + "/" + n;
          return FS[full] && FS[full].type === "dir" ? n + "/" : n;
        }).join("  "));
        lastStatus = 0;
      },
      cat: function (a) {
        if (!a[0]) { print("cat: missing operand", "err"); lastStatus = 1; return; }
        var t = resolve(a[0]); if (!t) { print("cat: " + a[0] + ": No such file or directory", "err"); lastStatus = 1; return; }
        if (t.node.type === "dir") { print("cat: " + a[0] + ": Is a directory", "err"); lastStatus = 1; return; }
        print(t.node.data); lastStatus = 0;
      },
      ver: function () { print("HopeOS version 0.2.0 (M0)\nCopyright Hope Studio (2019-2026), all rights reserved."); lastStatus = 0; },
      uname: function (a) { print(a.indexOf("-a") >= 0 ? "HopeOS hopeos 0.2.0 #1 SMP PREEMPT_DYNAMIC x86_64 GNU/Linux" : "HopeOS"); lastStatus = 0; },
      whoami: function () { print("hopeos"); lastStatus = 0; },
      date: function () { print(new Date().toString()); lastStatus = 0; },
      about: function () { print("HopeOS: a from-scratch UEFI OS for learning internals.\nVisit https://hopestudio.mysxl.cn"); lastStatus = 0; },
      hopestudio: function () { print("https://hopestudio.mysxl.cn"); lastStatus = 0; },
      hello: function () { print("Hello from HopeOS!"); lastStatus = 0; },
      credits: function () { print("HopeOS — Hope Studio (希望工作室) 2019-2026."); lastStatus = 0; },
      neofetch: function () {
        var logo = ["   __  __", "  / / / /__  ___", " / /_/ / _ \\/ -_)", " \\____/\\___/\\__/"];
        var info = ["hopeos@hopestudio", "-----------------", "OS: HopeOS 0.2.0 (M0)", "Kernel: hopeos 0.2.0", "Arch: x86_64", "Shell: sh", "DE: StarDustUI", "Uptime: " + Math.floor(performance.now() / 1000) + "s"];
        for (var i = 0; i < Math.max(logo.length, info.length); i++)
          print('<span style="color:#c8c8c8">' + esc((logo[i] || "").padEnd(16, " ")) + '</span>' + esc(info[i] ? "  " + info[i] : ""));
        lastStatus = 0;
      },
      clear: function () { outHTML = ""; lastStatus = 0; }
    };
    function run(line) {
      var t = line.trim(); if (!t) return;
      t = expand(t);
      hist.push(t); hidx = hist.length;
      var parts = t.split(/\s+/).filter(Boolean);
      var c = parts[0], a = parts.slice(1);
      if (!c) return;
      if (commands[c]) { try { commands[c](a); } catch (e) { print(c + ": error: " + e.message, "err"); lastStatus = 1; } }
      else { print("sh: /bin/" + c + ": not found (errno 2)", "err"); lastStatus = 127; }
    }
    print("HopeOS Terminal");
    print("HopeOS shell. Type 'help'.");
    box.tabIndex = 0;
    box.addEventListener("click", function () { box.focus(); });
    box.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        print(promptStr() + buf);
        run(buf);
        buf = ""; cur = 0; render();
      } else if (e.key === "Backspace") {
        e.preventDefault();
        if (cur > 0) { buf = buf.slice(0, cur - 1) + buf.slice(cur); cur--; render(); }
      } else if (e.key === "ArrowLeft") { e.preventDefault(); if (cur > 0) { cur--; render(); } }
      else if (e.key === "ArrowRight") { e.preventDefault(); if (cur < buf.length) { cur++; render(); } }
      else if (e.key === "ArrowUp") { e.preventDefault(); if (hidx > 0) { hidx--; buf = hist[hidx] || ""; cur = buf.length; render(); } }
      else if (e.key === "ArrowDown") { e.preventDefault(); if (hidx < hist.length - 1) { hidx++; buf = hist[hidx] || ""; } else { hidx = hist.length; buf = ""; } cur = buf.length; render(); }
      else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
        buf = buf.slice(0, cur) + e.key + buf.slice(cur); cur++; render();
      }
    });
    rec.onFocus = function () { setTimeout(function () { box.focus(); }, 30); };
    render();
    return box;
  }

  /* ===================== app: calculator ===================== */
  function makeCalculator() {
    var b = document.createElement("div"); b.className = "calc";
    b.innerHTML = '<div class="calc-disp" id="cdisp">0</div><div class="calc-grid" id="cgrid"></div>';
    var disp = b.querySelector("#cdisp"), grid = b.querySelector("#cgrid");
    var val = 0, op = null, fresh = true;
    function show() { disp.textContent = String(val); }
    var keys = [["C","+","-","*"],["7","8","9","/"],["4","5","6","="],["1","2","3","0"]];
    keys.forEach(function (row) {
      row.forEach(function (k) {
        var btn = document.createElement("button");
        btn.textContent = k;
        if (k === "C") btn.className = "calc-clr";
        else if (k === "=") btn.className = "calc-eq";
        else if (k === "+" || k === "-" || k === "*" || k === "/") btn.className = "calc-op";
        else btn.className = "calc-num";
        btn.addEventListener("click", function () {
          if (k >= "0" && k <= "9") {
            val = fresh ? (val * 10 + parseInt(k)) : parseInt(k);
            fresh = false;
          } else if (k === "C") { val = 0; op = null; fresh = true; }
          else if (k === "=") { op = null; fresh = true; }
          else { op = k; fresh = true; }
          show();
        });
        grid.appendChild(btn);
      });
    });
    show();
    return b;
  }

  /* ===================== app: clock ===================== */
  function makeClock() {
    var b = document.createElement("div"); b.className = "clk";
    b.innerHTML = '<div class="big" id="clk-big">--:--:--</div><div class="sub">HopeOS Clock</div>';
    var big = b.querySelector("#clk-big");
    function tick() {
      var d = new Date();
      big.textContent = [d.getHours(), d.getMinutes(), d.getSeconds()].map(function (n) { return String(n).padStart(2, "0"); }).join(":");
    }
    tick(); var id = setInterval(tick, 1000);
    b._timer = id;
    return b;
  }

  /* ===================== app: paint ===================== */
  function makePaint() {
    var b = document.createElement("div"); b.className = "paint";
    var cv = document.createElement("canvas");
    b.appendChild(cv);
    setTimeout(function () {
      cv.width = b.clientWidth; cv.height = b.clientHeight;
      var ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
      var drawing = false;
      function pos(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
      cv.addEventListener("mousedown", function (e) { drawing = true; var p = pos(e); ctx.fillStyle = "#0054e3"; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); });
      cv.addEventListener("mousemove", function (e) { if (!drawing) return; var p = pos(e); ctx.fillStyle = "#0054e3"; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); });
      window.addEventListener("mouseup", function () { drawing = false; });
    }, 30);
    return b;
  }

  /* ===================== app: notepad ===================== */
  function makeNotepad() {
    var b = document.createElement("div"); b.style.position = "absolute"; b.style.inset = "0";
    b.innerHTML = '<div class="np-toolbar"><span class="t">Notepad</span>' +
      '<span class="np-btn" id="np-save">Save</span><span class="np-btn" id="np-open">Open</span></div>' +
      '<textarea class="np-area" id="np-area" spellcheck="false">HopeOS Notepad\nType here...</textarea>';
    var area = b.querySelector("#np-area");
    b.querySelector("#np-save").addEventListener("click", function () { area.dataset.saved = area.value; area.blur(); });
    b.querySelector("#np-open").addEventListener("click", function () { area.value = area.dataset.saved || ""; });
    return b;
  }

  /* ===================== app: sysmonitor ===================== */
  function makeSys() {
    var b = document.createElement("div"); b.className = "sys";
    function tick() {
      var d = Math.floor(performance.now() / 1000);
      b.innerHTML = "<b>HopeOS SysMonitor</b><br>" +
        "Uptime: " + d + "s<br>" +
        "Threads: 16<br>" +
        "Windows: " + Object.keys(openWins).length + "<br>" +
        "Memory: " + (8 - (d % 3)) + " / 8 MiB<br>" +
        "DE: StarDustUI<br>" +
        "Kernel: hopeos 0.2.0";
    }
    tick(); b._timer = setInterval(tick, 1000);
    return b;
  }

  /* ===================== app: filemgr ===================== */
  function makeFm() {
    var b = document.createElement("div"); b.className = "fm";
    function render() {
      var lines = ["/" + cwd.slice(1)];
      var node = resolve(cwd);
      if (node && node.type === "dir") {
        node.node.children.forEach(function (n) {
          var full = (cwd === "/" ? "" : cwd) + "/" + n;
          lines.push("  " + (FS[full] && FS[full].type === "dir" ? "[" + n + "]" : n));
        });
      }
      b.textContent = "HopeOS FileMgr\n" + lines.join("\n");
    }
    render();
    b._refresh = render;
    return b;
  }

  /* ===================== app: control panel / snake (placeholder) ===================== */
  function makeControl() {
    var b = document.createElement("div"); b.className = "ph";
    b.innerHTML = '<div class="big">Control Panel</div><div>设置项：显示 / 区域 / 电源（演示占位）</div>';
    return b;
  }
  function makeSnake() {
    var b = document.createElement("div"); b.className = "ph";
    b.innerHTML = '<div class="big">Snake</div><div>贪吃蛇小游戏（模拟器占位）</div>';
    return b;
  }

  /* keep timers/refresh aligned with focus; refresh filemgr on open is enough */

  /* ===================== clock (taskbar) ===================== */
  function tickClock() {
    var d = new Date();
    document.getElementById("clock").textContent =
      [d.getHours(), d.getMinutes(), d.getSeconds()].map(function (n) { return String(n).padStart(2, "0"); }).join(":");
  }
  tickClock(); setInterval(tickClock, 1000);

  window.addEventListener("resize", function () { buildIcons(); buildStartMenu(); layoutTaskItems(); });

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
})();
</script>
</body>
</html>
