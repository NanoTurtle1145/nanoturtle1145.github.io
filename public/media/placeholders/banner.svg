<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2a5e"/>
      <stop offset="55%" stop-color="#1867c0"/>
      <stop offset="100%" stop-color="#143d6e"/>
    </linearGradient>
    <linearGradient id="glowline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7fd4ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#aee3ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7fd4ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#4f7dff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4f7dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="78%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#7fd4ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7fd4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurS" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#glow1)"/>
  <rect width="1600" height="620" fill="url(#glow2)"/>

  <!-- 玻璃光晕 -->
  <circle cx="180" cy="150" r="120" fill="#4f7dff" opacity="0.18" filter="url(#blurS)"/>
  <circle cx="1350" cy="480" r="150" fill="#7fd4ff" opacity="0.16" filter="url(#blurS)"/>
  <circle cx="900" cy="120" r="100" fill="#aee3ff" opacity="0.12" filter="url(#blurS)"/>

  <!-- 网格（极淡） -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
        <line x1="0" y1="0" x2="0" y2="620"/>
    <line x1="80" y1="0" x2="80" y2="620"/>
    <line x1="160" y1="0" x2="160" y2="620"/>
    <line x1="240" y1="0" x2="240" y2="620"/>
    <line x1="320" y1="0" x2="320" y2="620"/>
    <line x1="400" y1="0" x2="400" y2="620"/>
    <line x1="480" y1="0" x2="480" y2="620"/>
    <line x1="560" y1="0" x2="560" y2="620"/>
    <line x1="640" y1="0" x2="640" y2="620"/>
    <line x1="720" y1="0" x2="720" y2="620"/>
    <line x1="800" y1="0" x2="800" y2="620"/>
    <line x1="880" y1="0" x2="880" y2="620"/>
    <line x1="960" y1="0" x2="960" y2="620"/>
    <line x1="1040" y1="0" x2="1040" y2="620"/>
    <line x1="1120" y1="0" x2="1120" y2="620"/>
    <line x1="1200" y1="0" x2="1200" y2="620"/>
    <line x1="1280" y1="0" x2="1280" y2="620"/>
    <line x1="1360" y1="0" x2="1360" y2="620"/>
    <line x1="1440" y1="0" x2="1440" y2="620"/>
    <line x1="1520" y1="0" x2="1520" y2="620"/>
    <line x1="1600" y1="0" x2="1600" y2="620"/>
        <line x1="0" y1="0" x2="1600" y2="0"/>
    <line x1="0" y1="80" x2="1600" y2="80"/>
    <line x1="0" y1="160" x2="1600" y2="160"/>
    <line x1="0" y1="240" x2="1600" y2="240"/>
    <line x1="0" y1="320" x2="1600" y2="320"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="480" x2="1600" y2="480"/>
    <line x1="0" y1="560" x2="1600" y2="560"/>
