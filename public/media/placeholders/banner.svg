  <!-- 流畅线条 -->
  <g>
    <path d="M -50 420 C 220 300, 420 470, 700 360 C 960 260, 1160 380, 1660 240" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.35" stroke-linecap="round"/><path d="M -50 470 C 250 380, 450 540, 760 430 C 1000 350, 1220 460, 1660 330" fill="none" stroke="#7fd4ff" stroke-width="1.2" stroke-opacity="0.3" stroke-linecap="round"/><path d="M -50 360 C 260 250, 500 400, 780 300 C 1040 210, 1260 320, 1660 190" fill="none" stroke="#ffffff" stroke-width="1.0" stroke-opacity="0.22" stroke-linecap="round"/><path d="M -50 520 C 300 440, 520 590, 820 480 C 1080 400, 1320 500, 1660 380" fill="none" stroke="#b3e6ff" stroke-width="1.0" stroke-opacity="0.2" stroke-linecap="round"/><path d="M -50 300 C 240 200, 520 330, 760 240 C 1040 160, 1300 260, 1660 150" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.15" stroke-linecap="round"/><path d="M -50 560 C 280 490, 560 620, 860 520 C 1120 440, 1380 540, 1660 430" fill="none" stroke="#7fd4ff" stroke-width="0.8" stroke-opacity="0.15" stroke-linecap="round"/><path d="M -50 600 C 300 560, 600 630, 900 570 C 1200 520, 1400 600, 1660 550" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.12" stroke-linecap="round"/>
  </g>

  <!-- 光点 -->
  <g fill="#cdeeff">
    <circle cx="250" cy="345" r="3" opacity="0.8"/><circle cx="430" cy="408" r="2" opacity="0.6"/><circle cx="620" cy="372" r="3" opacity="0.7"/><circle cx="850" cy="355" r="2" opacity="0.55"/><circle cx="1050" cy="300" r="3" opacity="0.75"/><circle cx="1300" cy="330" r="2" opacity="0.6"/><circle cx="1500" cy="258" r="3" opacity="0.7"/><circle cx="320" cy="440" r="2" opacity="0.5"/><circle cx="700" cy="465" r="2" opacity="0.6"/><circle cx="1180" cy="398" r="2" opacity="0.5"/>
