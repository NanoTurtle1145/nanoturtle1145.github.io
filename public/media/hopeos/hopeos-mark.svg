<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="HopeOS 标志">
  <title>HopeOS 标志：H + 日出</title>
  <desc>圆角方框（操作系统窗口）内是 H 形双柱与横梁，横梁上方的弧线与射线是一轮从地平线升起的太阳；横梁下的两道短线是水面倒影。深色线稿 + 实心柱体，单色可印刷。</desc>
  <!-- 圆角方框：操作系统/窗口 -->
  <g fill="none" stroke="#0B1220" stroke-width="12" stroke-linecap="butt" stroke-linejoin="round">
    <rect x="76" y="76" width="872" height="872" rx="196"/>
  </g>
  <!-- H：双柱 + 横梁（实心，代表内核/硬件底座） -->
  <g fill="#0B1220">
    <rect x="286" y="296" width="52" height="472" rx="8"/>
    <rect x="686" y="296" width="52" height="472" rx="8"/>
    <rect x="286" y="506" width="452" height="36" rx="8"/>
  </g>
  <!-- 日出：半圆弧 + 三道射线（线稿，代表希望/黎明） -->
  <g fill="none" stroke="#0B1220" stroke-width="12" stroke-linecap="round">
    <path d="M394 506A118 118 0 0 1 630 506"/>
    <path d="M512 356V316"/>
    <path d="M608 391L634 360"/>
    <path d="M416 391L390 360"/>
    <path d="M432 612H592"/>
    <path d="M470 668H554"/>
  </g>
</svg>
